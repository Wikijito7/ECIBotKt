# slf4j-simple configuration for the isolated JDA runtime.
# DAVE negotiation evidence is emitted at DEBUG by libdave's JDA adapter:
#   "DAVE Init - Protocol version=..."
#   "Transition executed: ID=..., Protocol version=..."
#   "MLS Failure - ..." (must not appear on a healthy run)
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.log.moe.kyokobot.libdave.jda.internal.DAVEManager=debug
